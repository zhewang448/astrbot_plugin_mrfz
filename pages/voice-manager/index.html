<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语音档案控制台</title>
    <style>
      html { background: #f6f7f9; }
      html[data-theme="dark"] { background: #15181d; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #677180;
        font: 14px/1.6 "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      }
      html[data-theme="dark"] body { color: #98a1ae; }
    </style>
  </head>
  <body>
    <p id="status">正在打开语音档案…</p>
    <script type="module">
      // 入口页只负责按插件配置 page_style 跳转到 modern/ 或 classic/。
      // 跳转时带上当前 query（asset_token、theme），子页面才能通过鉴权。
      const bridge = window.AstrBotPluginPage;

      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise((_, reject) => window.setTimeout(() => reject(new Error("timeout")), ms)),
        ]);
      }

      async function resolveStyle() {
        if (!bridge) return "modern";
        try {
          await withTimeout(bridge.ready(), 4000);
          const data = await withTimeout(bridge.apiGet("page/ui"), 4000);
          return data?.style === "classic" ? "classic" : "modern";
        } catch {
          return "modern";
        }
      }

      const style = await resolveStyle();
      window.location.replace(
        new URL(`${style}/index.html${window.location.search}`, window.location.href).href,
      );
    </script>
  </body>
</html>
